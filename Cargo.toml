[package]
name = "servoq"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# servo/media-gstreamer links servo-media's GStreamer backend so <audio>/<video>
# actually decode and play (the default DummyBackend is a no-op).
servo-engine = ["dep:servo", "servo/media-gstreamer", "servo/webgpu", "dep:dpi", "dep:euclid", "dep:url", "dep:keyboard-types", "dep:raw-window-handle", "dep:glow", "dep:adblock"]

[dependencies]
cxx = "1.0"
libc = "0.2"
adblock = { version = "0.12", optional = true }
servo = { version = "0.4.0", optional = true }
dpi = { version = "0.1", optional = true }
euclid = { version = "0.22", optional = true }
url = { version = "2", optional = true }
keyboard-types = { version = "0.7", optional = true }
raw-window-handle = { version = "0.6", optional = true }
glow = { version = "0.17", optional = true }

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

# Patch servo-media's GStreamer backend (a transitive dep of `servo`) with a copy
# that does NOT set playbin3's "download" (progressive-download) flag. That flag
# makes urisourcebin pre-parse Servo's push `servosrc`, and on GStreamer 1.28 a
# pushed containerless MP3 trips a fatal decodebin3 assertion that aborts the whole
# browser. Same crate name/version (0.4.0), one block removed. See
# third_party/servo-media-gstreamer/player.rs and docs/DEVIATIONS.md §0k.
[patch.crates-io]
servo-media-gstreamer = { path = "third_party/servo-media-gstreamer" }
